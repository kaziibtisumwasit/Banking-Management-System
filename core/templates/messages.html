{% if messages %}
<div class="space-y-2">
    {% for message in messages %}
    <div class="flex items-center justify-between px-4 py-3.5 rounded-xl border shadow-lg {% if 'error' in message.tags %}bg-rose-950/90 border-rose-500/40 text-rose-200{% elif 'warning' in message.tags %}bg-amber-950/90 border-amber-500/40 text-amber-200{% else %}bg-emerald-950/90 border-emerald-500/40 text-emerald-200{% endif %}" role="alert">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full {% if 'error' in message.tags %}bg-rose-400{% elif 'warning' in message.tags %}bg-amber-400{% else %}bg-emerald-400{% endif %}"></span>
            <p class="text-sm font-medium">{{ message }}</p>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-xs opacity-70 hover:opacity-100 px-2">✕</button>
    </div>
    {% endfor %}
</div>
{% endif %}
