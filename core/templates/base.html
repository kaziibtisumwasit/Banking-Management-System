<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block head_title %}
    <title>NexusBank — Digital Banking System</title>
    {% endblock %}
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
    <!-- Background Gradient Glow -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-32 w-96 h-96 rounded-full bg-indigo-600/20 blur-3xl"></div>
        <div class="absolute top-1/3 -left-32 w-96 h-96 rounded-full bg-emerald-500/10 blur-3xl"></div>
    </div>

    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Flash Notifications -->
    <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 mt-4">
        {% include 'messages.html' %}
    </div>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        {% block body %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'footer.html' %}
</body>

</html>
